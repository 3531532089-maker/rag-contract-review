# ============================================
# 阿里云 Nginx HTTPS 配置
# 放置路径: /etc/nginx/sites-available/contract-review
# ============================================
#
# SSL 证书申请（使用 Let's Encrypt 免费证书）：
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d your-domain.com
#
# 阿里云 SSL 证书（免费 20 个/年）：
#   阿里云控制台 → SSL 证书 → 购买免费 DV 单域名证书
#

# ===== HTTP → HTTPS 重定向 =====
server {
    listen 80;
    server_name your-domain.com;   # ← 改成你的域名或公网 IP

    # Let's Encrypt 验证用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余全部重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ===== HTTPS 主站 =====
server {
    listen 443 ssl http2;
    server_name your-domain.com;   # ← 改成你的域名或公网 IP

    # ===== SSL 证书 =====
    # 阿里云免费证书下载后放到 /etc/nginx/certs/
    ssl_certificate     /etc/nginx/certs/your-domain.com.pem;
    ssl_certificate_key /etc/nginx/certs/your-domain.com.key;

    # ===== SSL 安全配置 =====
    ssl_protocols TLSv1.2 TLSv1.3;            # 禁用老旧的 TLS 1.0/1.1
    ssl_ciphers ECDHE+AESGCM:ECDHE+CHACHA20;  # 只允许强加密套件
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS（强制浏览器走 HTTPS）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ===== 上传大小限制 =====
    client_max_body_size 30M;

    # ===== 前端（Next.js）=====
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== 后端 API =====
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API 超时（审查最长 120 秒）
        proxy_read_timeout 130s;
        proxy_connect_timeout 10s;
    }

    # ===== API 文档 =====
    location /docs {
        # 生产环境可加 IP 白名单
        # allow 你的办公IP;
        # deny all;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
}
